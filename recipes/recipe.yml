---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: aurora-dx-hibiscus
# description will be included in the image's metadata
description: Mizuki's personal aurora-dx-based image <3

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      nonfree: rpmfusion
      files:
        - https://raw.githubusercontent.com/terrapkg/packages/f%OS_VERSION%/anda/terra/release/terra.repo
    install:
      no-gpgchecks: true
      packages:
        - terra-release
        - terra-release-extras
        - terra-release-mesa

  - type: dnf
    install:
      packages:
        - terra-gpg-keys
        - adoptium-temurin-java-repository

  - type: dnf
    repos:
      files:
        - https://www.scootersoftware.com/scootersoftware.repo
    install:
      packages:
        - bcompare

  - type: dnf
    repos:
      files:
        - https://download.opensuse.org/repositories/home:mkittler/Fedora_%OS_VERSION%/home:mkittler.repo
    install:
      packages:
        - syncthingtray-qt6
        - syncthingplasmoid-qt6
        - syncthingfileitemaction-qt6
        - syncthingctl-qt6

  - type: dnf
    repos:
      files:
        - https://raw.githubusercontent.com/albersonmiranda/r_tools_ppa/refs/heads/main/rpm/x86_64/repo.txt
    install:
      packages:
        - rstudio

  - type: dnf
    source: local
    repos:
      disable: terra
      copr:
        - cuteneko/waydroid-helper
    install:
      packages:
        - waydroid-helper

  - type: dnf
    source: local
    repos:
      files:
        - https://fedorapeople.org/groups/virt/virtio-win/virtio-win.repo
      enable:
        - adoptium-temurin-java-repository
        - terra
        - terra-extras
        - terra-mesa
      disable:
        - virtio-win-stable
        - home_mkittler
        - scootersoftware
        - r_tools_ppa
      # - copr:copr.fedorainfracloud.org:faugus:faugus-launcher
    # copr:
    #   - faugus/faugus-launcher
    remove:
      packages:
        - Sunshine
    replace:
      - from-repo: terra-extras
        packages:
          - old: ddcutil
            new: terra-ddcutil
    install:
      packages:
        - gamescope
        - scopebuddy
      # - faugus-launcher

        - temurin-25-jdk
        - micro
        - python-proton-vpn-cli
        - proton-vpn-qt-app
        - coolercontrol
        - coolercontrold
        - waydroid
        - nohang-nightly

        - gsmartcontrol
        - btrfs-heatmap
        - btrfsmaintenance
        - mmc-utils
        - cmospwd
        - byebyebios
        - efivar
        - pesign
        - sbsigntools
        - smbios-utils
        - coreboot-utils-all
        - usbview
        - playerctl
        - gparted
        - golly
        - ucblogo
        - vkmark
        - below
        - firejail
        - hardinfo2
        - lxqt-admin
        - pcmanfm-qt
        - zswap-cli
        - qt5ct
        - qt6ct
        - accessibility-inspector
        - android-udev-rules
        - chkconfig
        - cpuinfo

  - type: script
    scripts:
    # - bcompare.sh # beyondcompare keygen, kept as a backup
      - customization.sh

  - type: script
    secrets:
      - type: env
        name: SB_KEY
        mount:
          type: file
          destination: /tmp/SB_KEY
      - type: env
        name: SB_CERT
        mount:
          type: file
          destination: /tmp/SB_CERT
      - type: env
        name: GH_TOKEN
        mount:
          type: env
          name: GH_TOKEN
    scripts:
      - hermes.sh # Install Hermes and Hermes-KMS

  - type: systemd
    system:
      disabled:
        - systemd-oomd.service
      enabled:
        - coolercontrold.service
        - nohang-desktop.service
        - podman.socket
    user:
      enabled:
        - hermes.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
